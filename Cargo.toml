[package]
name = "fuse_mt"
version = "0.6.0"
authors = ["William R. Fraser <wfraser@codewise.org>"]
repository = "https://github.com/wfraser/fuse-mt"
description = "A higher-level FUSE filesystem library with multi-threading and inode->path translation."
categories = ["filesystem"]
keywords = ["fuse", "filesystem"]
license = "MIT/Apache-2.0"
readme = "README.md"
edition = "2021"

[features]
default = [ "max_level_info" ]
max_level_info 	= [ "tracing/max_level_info" ]
max_level_debug = [ "tracing/max_level_debug" ]
max_level_warn 	= [ "tracing/max_level_warn" ]
max_level_error = [ "tracing/max_level_error" ]
max_level_off 	= [ "tracing/max_level_off" ]

[dependencies]
tracing = "0.1"
libc = "0.2"
threadpool = "1.8.1"
serde={ version="1.0", optional=true }

[dependencies.fuser]
version="0.11"
features=[ "abi-7-31", "libfuse" ]

[workspace]
members = [".", "example"]
