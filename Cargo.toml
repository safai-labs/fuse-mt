[package]
name = "fuse_mt"
version = "0.6.0"
authors = ["William R. Fraser <wfraser@codewise.org>"]
repository = "https://github.com/wfraser/fuse-mt"
description = "A higher-level FUSE filesystem library with multi-threading and inode->path translation."
categories = ["filesystem"]
keywords = ["fuse", "filesystem"]
license = "MIT/Apache-2.0"
readme = "README.md"
edition = "2018"

[features]
default = []

[dependencies]
tracing = "0.1.36"
libc = "0.2.126"
threadpool = "1.8.1"
serde={ version = "1.0.141", optional = true }

[dependencies.fuser]
version= "0.11.0"
features=[ "abi-7-31", "libfuse" ]
